name: astrbot_plugin_mumu_vm
display_name: MuMu 安卓虚拟机（Agent 手机）
desc: '让 Agent 独占操控 MuMu 模拟器里的安卓手机：模拟器窗口隐藏、桌面只给 Agent 看；单帧截图 / 连续采样多帧（一次返回多张带时间戳的图片）看懂动态画面；UI 树点击、中文输入、App 与系统控制；由 Agent 自行判断调用工具进入“玩手机”模式，进入后同一轮工具组切换为完整手机工具、收手后同轮恢复普通工具继续其它任务；被打扰时只回“正在玩手机”并把消息交给 Agent 决定是否回复；支持空闲/定时自主玩手机、每日预算、随时收手；可选 iris 记忆兼容（可关闭）与插件自带本地记忆（使用记录/操作技巧，支持语义检索）；可选媒体辅助（录屏→视觉转述 / 录音→STT 或音频多模态模型）。'
version: v1.6.0
author: AwayDAJIBA
astrbot_version: '>=4.27.3,<5'
repo: https://github.com/AwayDAJIBA/astrbot_plugin_mumu_vm
