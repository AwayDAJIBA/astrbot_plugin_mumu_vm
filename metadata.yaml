name: astrbot_plugin_mumu_vm
display_name: MuMu 安卓虚拟机（Agent 手机）
desc: '让 Agent 独占操控 MuMu 模拟器里的安卓手机：模拟器窗口隐藏、桌面只给 Agent 看；单帧截图 / 连续采样多帧（一次返回多张带时间戳的图片）看懂动态画面；UI 树点击、中文输入、App 与系统控制；进入“玩手机”模式后自动精简工具与上下文提速；被打扰时只回“正在玩手机”并把消息交给 Agent 决定是否回复；支持空闲/定时自主玩手机、每日预算、随时收手、可选记忆插件与操作教程总结。'
version: v1.3.0
author: AwayDAJIBA
astrbot_version: '>=4.27.3,<5'
repo: https://github.com/AwayDAJIBA/astrbot_plugin_mumu_vm
